<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>筋メシ｜筋トレ＆食事管理</title>
<meta name="description" content="自分専用の筋トレ・食事管理アプリ。写真でAIカロリー解析。">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="筋メシ">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="app">
    <main id="screen" class="screen"></main>
    <nav class="tabbar" role="tablist">
      <button data-tab="home" class="active"><span class="tab-ic" id="tab-ic-home"></span>ホーム</button>
      <button data-tab="workout"><span class="tab-ic" id="tab-ic-workout"></span>筋トレ</button>
      <button data-tab="meals"><span class="tab-ic" id="tab-ic-meals"></span>食事</button>
      <button data-tab="calendar"><span class="tab-ic" id="tab-ic-calendar"></span>記録</button>
      <button data-tab="settings"><span class="tab-ic" id="tab-ic-settings"></span>設定</button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="rest-timer" style="display:none">
    <span class="rt-label">☕ 休憩</span>
    <span class="rt-time">1:30</span>
    <select class="rt-set" id="rt-sec" aria-label="休憩秒数">
      <option value="30">30秒</option>
      <option value="60">60秒</option>
      <option value="90" selected>90秒</option>
      <option value="120">120秒</option>
      <option value="180">180秒</option>
    </select>
    <button id="rt-plus">+30秒</button>
    <button id="rt-skip">スキップ</button>
  </div>
  <div id="rt-big" style="display:none">
    <div class="rtb-label">☕ 休憩</div>
    <div class="rtb-time">1:30</div>
    <div class="rtb-btns">
      <button id="rtb-plus">+30秒</button>
      <button id="rtb-skip">スキップ</button>
    </div>
    <div class="rtb-hint">画面をタップで戻る ・ この画面の間はスリープしません</div>
  </div>
  <div id="toast" role="status"></div>
  <div id="chart-tip"></div>
  <input type="file" id="photo-input" accept="image/*" hidden>
  <input type="file" id="import-input" accept="application/json,.json" hidden>
  <input type="file" id="csv-input" accept=".csv,text/csv,text/plain" hidden>

  <script src="./js/presets.js"></script>
  <script src="./js/art.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/gemini.js"></script>
  <script src="./js/suggest.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/scr-home.js"></script>
  <script src="./js/scr-workout.js"></script>
  <script src="./js/scr-meals.js"></script>
  <script src="./js/scr-calendar.js"></script>
  <script src="./js/scr-settings.js"></script>
  <script src="./js/app.js"></script>
  <script>
    // タブアイコンを描画
    document.addEventListener('DOMContentLoaded', () => {
      for (const k of ['home', 'workout', 'meals', 'calendar', 'settings']) {
        const el = document.getElementById('tab-ic-' + k);
        if (el) el.innerHTML = ICONS[k];
      }
    });
  </script>
</body>
</html>
